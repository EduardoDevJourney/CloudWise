[tool.poetry]
name = "cloud-wise-backend"
version = "0.1.0"
description = "Cloud Proxy API - RunOps & Cloud Wise"
authors = ["Cloud Wise Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
sqlmodel = "^0.0.22"
alembic = "^1.14.0"
pydantic-settings = "^2.7.0"
pyodbc = "^5.2.0"
pulumi = "^3.140.0"
pulumi-azure-native = "^2.70.0"
python-multipart = "^0.0.20"
pymssql = "^2.3.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
