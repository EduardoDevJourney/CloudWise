services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cloud-wise-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-CloudWise@Dev123}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-CloudWise@Dev123}
    entrypoint: /bin/bash
    command:
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "IF DB_ID('cloudwise') IS NULL CREATE DATABASE cloudwise"
    restart: "no"

volumes:
  mssql_data:
